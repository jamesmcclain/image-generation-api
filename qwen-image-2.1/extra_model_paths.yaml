# Points ComfyUI at the read-only /models mount (the same directory the API
# mode reads), which uses ComfyUI's standard folder layout:
#
#   /models/diffusion_models/qwen_image_2.1_int8_convrot.safetensors
#   /models/text_encoders/qwen3vl_8b_int8_convrot.safetensors
#   /models/vae/qwen_image_2.1_vae_bf16.safetensors
#
# ComfyUI also keeps its own (writable) models folder under COMFYUI_DATA, so
# anything downloaded from inside the UI lands there instead.
qwen_image_models:
  base_path: /models
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  vae: vae
  loras: loras
